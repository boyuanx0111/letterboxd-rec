services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      PORT: "8000"
      LETTERBOXD_CACHE_PATH: /var/lib/letterboxd-rec/cache.json
    volumes:
      - letterboxd-cache:/var/lib/letterboxd-rec
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL to the public API URL}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  letterboxd-cache:
