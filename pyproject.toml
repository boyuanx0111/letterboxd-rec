[tool.ruff]
target-version = "py312"
line-length = 100
# These are notebooks and local data/model diagnostics, not project source files.
exclude = [
  "frontend",
  "notebooks",
  "src/tests/**",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "backend"]
exclude = [
  "**/__pycache__",
  "**/.pytest_cache",
  "**/.ruff_cache",
  "**/build",
  "**/dist",
  "frontend",
  "notebooks",
  # Legacy diagnostics under src/tests execute against local models and datasets.
  "src/tests/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
